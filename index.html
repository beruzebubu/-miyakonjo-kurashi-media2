ntrols button{grid-column:1/-1;border:0;background:#24523d;color:#fff;font-weight:700}.jobs{padding:0 20px 28px}.jobs h2{font-family:"Yu Mincho",serif}.job{display:grid;grid-template-columns:120px 1fr;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}.job img{width:120px;height:158px;object-fit:cover}.job .body{padding:14px}.job small{color:#4d725f}.job h3{margin:7px 0;font-size:18px}.job strong{color:#25543f}.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;height:72px;background:rgba(255,255,255,.98);border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr)}.nav a{display:grid;place-items:center;text-align:center;font-size:12px;font-weight:700;color:#22513c}.nav b{font-size:22px;display:block}@media(min-width:800px){body{padding-bottom:0}.intro,.grid,.search,.jobs{max-width:1180px;margin-left:auto;margin-right:auto}.grid{grid-template-columns:2fr 1fr 1fr}.card.big{grid-column:auto;grid-row:span 2;height:674px}.card{height:330px}.nav{display:none}}

<main>

<section class="grid">
<article class="card big"><img src="assets/miyako-model.svg" alt="美容師として働く女性"><span class="num">01</span><div class="copy"><small>BEAUTY</small><h2>美容・理容</h2></div><span class="arrow">↗</span></article>
<article class="card"><img src="assets/jo-model.svg" alt="建設現場で働く男性"><span class="num">02</span><div class="copy"><small>CONSTRUCTION</small><h2>建設・設備・運送</h2></div><span class="arrow">↗</span></article>
<article class="card"><img src="https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=900&q=85" alt="飲食店で接客するスタッフ"><span class="num">03</span><div class="copy"><small>SERVICE</small><h2>飲食・販売・接客</h2></div><span class="arrow">↗</span></article>
<article class="card"><img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=900&q=85" alt="介護や医療の現場で働くスタッフ"><span class="num">04</span><div class="copy"><small>CARE</small><h2>介護・医療・福祉</h2></div><span class="arrow">↗</span></article>
<article class="card"><img src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=900&q=85" alt="オフィスで働くスタッフ"><span class="num">05</span><div class="copy"><small>OFFICE</small><h2>事務・営業・製造</h2></div><span class="arrow">↗</span></article>

<section class="search"><h3>求人を探す</h3><div class="controls"><input placeholder="美容、事務、未経験など"><select><option>職種を選ぶ</option><option>美容・理容</option><option>建設・設備・運送</option><option>飲食・販売・接客</option><option>介護・医療・福祉</option><option>事務・営業・製造</option></select><select><option>エリアを選ぶ</option><option>都城市</option><option>三股町</option><option>曽於市</option></select><button onclick="document.getElementById('jobs').scrollIntoView({behavior:'smooth'})">この条件で探す</button></div></section>
<section class="jobs" id="jobs"><h2>新着求人</h2>
<article class="job"><img src="assets/miyako-model.svg" alt="美容師求人"><div class="body"><small>都城市</small><h3>美容師スタイリスト</h3><strong>月給25万円保証／歩合45%</strong><p>詳しく見る →</p></div></article>
