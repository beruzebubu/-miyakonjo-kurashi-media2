<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>プライバシーポリシー｜みやこんじょWORK</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="section-heading"><p class="eyebrow green">PRIVACY POLICY</p><h2>プライバシーポリシー</h2></div><div style="max-width:850px;margin:auto"><p>みやこんじょWORKは、求人情報を掲載する広告媒体です。求職者の応募情報は原則として運営側では取得せず、掲載企業へ直接送信されます。</p><h3>取得する情報</h3><p>掲載相談などでメールを送信された場合、氏名、会社名、メールアドレス、相談内容を取得することがあります。</p><h3>利用目的</h3><p>お問い合わせへの回答、求人掲載の確認、サービス運営上の連絡のために利用します。</p><h3>第三者提供</h3><p>法令に基づく場合を除き、本人の同意なく第三者へ提供しません。</p><h3>お問い合わせ</h3><p>個人情報の確認・訂正・削除については、サイト記載の連絡先へお問い合わせください。</p><p><a href="index.html">トップへ戻る</a></p></div></main></body></html>
