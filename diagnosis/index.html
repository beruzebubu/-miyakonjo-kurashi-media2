<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101812"><title>30秒仕事診断｜みやこんじょ求人</title><style>:root{--deep:#101812;--green:#29483a;--gold:#c4a878;--cream:#f4f0e8;--ink:#161b18;--muted:#69716c;--line:#ddd9d0;--linegreen:#06c755}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif;background:var(--cream);color:var(--ink)}button,a{font:inherit}.wrap{min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:#fff;box-shadow:0 24px 80px rgba(20,30,24,.16);overflow:hidden}.head{background:var(--deep);color:#fff;padding:24px}.head small{letter-spacing:.18em;color:#d8c29e}.head h1{font-family:serif;font-size:34px;margin:8px 0}.progress{height:5px;background:rgba(255,255,255,.18);margin-top:18px}.bar{height:100%;width:20%;background:var(--gold);transition:.35s}.body{padding:28px}.step{display:none}.step.active{display:block}.step h2{font-family:serif;font-size:28px;margin:0 0 8px}.step p{color:var(--muted);font-size:13px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.choice{border:1px solid var(--line);background:#fff;padding:16px;text-align:left;font-weight:700}.choice.active{background:var(--green);color:#fff;border-color:var(--green)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:26px}.next,.back{border:0;padding:14px 18px;font-weight:800}.next{background:var(--gold);color:#fff;margin-left:auto}.back{background:#eeeae3}.result{display:none;text-align:center}.result.active{display:block}.result h2{font-family:serif;font-size:34px}.summary{background:var(--cream);padding:18px;text-align:left;margin:18px 0;font-size:14px}.line{display:block;background:var(--linegreen);color:#fff;text-decoration:none;padding:17px;font-weight:900}.restart{border:0;background:none;margin-top:16px;color:var(--muted)}@media(max-width:560px){.wrap{padding:0}.card{min-height:100svh}.head{padding:20px}.body{padding:24px 18px}.choices{grid-template-columns:1fr}.step h2{font-size:25px}}</style></head><body><div class="wrap"><main class="card"><header class="head"><small>30 SECOND JOB CHECK</small><h1>30秒で仕事を診断</h1><p>3つ答えるだけ。合いそうな仕事をLINEで受け取れます。</p><div class="progress"><div class="bar" id="bar"></div></div></header><div class="body"><section class="step active" data-step="1"><h2>どんな働き方がいい？</h2><p>一番近いものを選んでください。</p><div class="choices" data-key="type"><button class="choice">正社員</button><button class="choice">パート</button><button class="choice">どちらでも</button></div><div class="actions"><button class="next">次へ</button></div></section><section class="step" data-step="2"><h2>何を重視したい？</h2><div class="choices" data-key="priority"><button class="choice">休み</button><button class="choice">収入</button><button class="choice">時間</button><button class="choice">人間関係</button></div><div class="actions"><button class="back">戻る</button><button class="next">次へ</button></div></section><section class="step" data-step="3"><h2>興味のある仕事は？</h2><div class="choices" data-key="job"><button class="choice">美容</button><button class="choice">事務</button><button class="choice">介護</button><button class="choice">飲食</button><button class="choice">建設</button><button class="choice">まだ分からない</button></div><div class="actions"><button class="back">戻る</button><button class="next" id="finish">診断する</button></div></section><section class="result" id="result"><small>YOUR RESULT</small><h2>あなたに合いそうな仕事を探します。</h2><div class="summary" id="summary"></div><p>今ある求人だけでなく、まだ掲載前の求人も含めてLINEで案内します。</p><a class="line" href="#" id="lineLink">LINEで結果を受け取る</a><button class="restart" id="restart">最初からやり直す</button></section></div></main></div><script>let step=1;const ans={};const steps=[...document.querySelectorAll('.step')];const bar=document.getElementById('bar');document.querySelectorAll('.choices').forEach(g=>g.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{g.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');ans[g.dataset.key]=b.textContent;}));function show(n){step=n;steps.forEach(s=>s.classList.toggle('active',Number(s.dataset.step)===n));bar.style.width=(n/3*100)+'%'}document.querySelectorAll('.next').forEach(b=>b.onclick=()=>{if(b.id==='finish'){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));document.getElementById('result').classList.add('active');bar.style.width='100%';document.getElementById('summary').innerHTML='<b>雇用形態：</b>'+(ans.type||'未選択')+'<br><b>重視：</b>'+(ans.priority||'未選択')+'<br><b>職種：</b>'+(ans.job||'未選択');return}show(Math.min(3,step+1))});document.querySelectorAll('.back').forEach(b=>b.onclick=()=>show(Math.max(1,step-1)));document.getElementById('restart').onclick=()=>{Object.keys(ans).forEach(k=>delete ans[k]);document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));document.getElementById('result').classList.remove('active');show(1)};document.getElementById('lineLink').onclick=e=>{e.preventDefault();alert('LINE公式アカウントのURLを入れれば、ここから診断結果を送れます。')};</script></body></html>
